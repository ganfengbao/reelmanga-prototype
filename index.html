<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>魔搭网 · AI 大模型聚合平台</title>
<style>
:root{
  --bg:#eef1f8;
  --surface:#ffffff;
  --surface-2:#f4f7fc;
  --surface-3:#e9eef7;
  --line:rgba(37,60,110,.10);
  --line-strong:rgba(37,60,110,.16);
  --text:#15233a;
  --text-2:#5b6b84;
  --text-3:#8d99b3;
  --accent:#3b6cff;
  --accent-2:#ff8a3d;
  --green:#16a967;
  --accent-soft:#e8efff;
  --accent-2-soft:#fff0e6;
  --green-soft:#e2f6ee;
  --radius-sm:10px;
  --radius:14px;
  --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(37,60,110,.06);
  --shadow:0 1px 2px rgba(37,60,110,.05),0 12px 30px rgba(37,60,110,.10);
  --shadow-lg:0 2px 8px rgba(37,60,110,.08),0 28px 70px rgba(37,60,110,.16);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:.01em;
  background-image:
    radial-gradient(1100px 640px at 50% -12%, rgba(59,108,255,.12), transparent 62%),
    radial-gradient(840px 540px at 92% 108%, rgba(0,184,217,.10), transparent 55%),
    radial-gradient(720px 500px at 6% 100%, rgba(108,79,240,.08), transparent 55%);
  background-attachment:fixed;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;border:none;outline:none;background:none;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(37,60,110,.16);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(37,60,110,.26)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:auto 250px 1fr;grid-template-rows:60px 1fr;height:100vh;overflow:hidden}
.topbar{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);transition:background .15s var(--ease),color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.brand{display:flex;align-items:center;gap:10px;min-width:190px;padding-left:4px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7a92ff,#5a6cf0);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 16px rgba(90,108,240,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.brand b{font-size:16px;font-weight:700;letter-spacing:.5px}
.brand .sub{font-size:10.5px;color:var(--text-3);margin-top:1px;letter-spacing:.3px}
.new-chat{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;background:linear-gradient(135deg,#ffb066,#ff8a3d);color:#241206;font-weight:700;font-size:13px;box-shadow:0 6px 18px rgba(255,138,61,.30),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .12s var(--ease),filter .15s}
.new-chat:hover{filter:brightness(1.04);transform:translateY(-1px)}
.new-chat:active{transform:translateY(0)}
.bell-wrap{position:relative;display:grid;place-items:center}
.bell-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:#ff5a5f;border:1.5px solid #0c0d12}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.orb{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#a5b6ff,#5a6cf0);box-shadow:0 0 0 1px rgba(255,255,255,.1),0 5px 16px rgba(90,108,240,.4);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffc58a,#ff8a3d);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}

/* ---------- Left rail ---------- */
.leftnav{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 5px;background:rgba(255,255,255,.62);border-right:1px solid var(--line)}
.nav-item{width:66px;height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-3);font-size:10.5px;font-weight:500;transition:background .15s,color .15s}
.nav-item svg{width:20px;height:20px}
.nav-item:hover{color:var(--text-2);background:var(--surface-2)}
.nav-item.active{color:var(--accent);background:var(--accent-soft);font-weight:600}

/* ---------- Left panel ---------- */
.leftpanel{display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);min-width:0}
.panel-tabs{display:flex;align-items:center;gap:2px;padding:12px 12px 6px}
.panel-tab{padding:5px 9px;border-radius:9px;color:var(--text-3);font-size:12px;font-weight:500;white-space:nowrap;flex:0 0 auto;transition:background .15s,color .15s}
.panel-tab:hover{color:var(--text-2);background:var(--surface-2)}
.panel-tab.active{color:var(--text);background:var(--surface-3);font-weight:600}
.search{margin:8px 14px 6px;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;background:var(--surface-2);border:1px solid transparent;transition:border-color .15s,background .15s}
.search:focus-within{border-color:rgba(109,124,255,.5);background:#0f1016}
.search svg{width:15px;height:15px;color:var(--text-3);flex-shrink:0}
.search input{flex:1;font-size:13px;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.scroll-list{flex:1;overflow:auto;padding:4px 10px 12px}
.item{display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px;margin-bottom:2px;cursor:pointer;transition:background .13s var(--ease)}
.item:hover{background:var(--surface-2)}
.item.active{background:var(--accent-soft);position:relative}
.item.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--accent)}
.ic-tile{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:15px;font-weight:700}
.item .meta{min-width:0;flex:1}
.item .meta b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta span{display:block;font-size:11.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .badge{font-size:9.5px;padding:2px 7px;border-radius:999px;font-weight:700;flex-shrink:0;letter-spacing:.3px}
.badge-hot{background:var(--accent-2-soft);color:#ffb277}
.badge-new{background:var(--green-soft);color:#5cdfa6}
.more-dot{color:var(--text-3);flex-shrink:0;display:grid;place-items:center;width:16px;height:16px;border-radius:6px;opacity:0;transition:opacity .15s}
.item:hover .more-dot{opacity:1}
.more-dot:hover{background:var(--surface-3)}
.profile{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:11px}
.profile .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#b6a2ff,#7a68f0);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.profile .meta{min-width:0;flex:1}
.profile .meta b{display:block;font-size:13px;font-weight:600}
.profile .meta span{font-size:11px;color:var(--text-3)}
.recharge{padding:7px 12px;border-radius:9px;background:linear-gradient(135deg,#5be0a2,#22b276);color:#061a10;font-weight:700;font-size:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.recharge:hover{filter:brightness(1.05)}

/* ---------- Main / chat ---------- */
.main{overflow:hidden;position:relative}
.view{height:100%;overflow:auto}
.view-inner{max-width:1200px;margin:0 auto;padding:26px 30px 32px}
.chat-wrap{display:flex;flex-direction:column;height:100%}
.chat-scroll{flex:1;overflow:auto;padding:26px 0 8px}
.msg{max-width:790px;margin:0 auto 24px;padding:0 30px}
.msg-row{display:flex;gap:14px;align-items:flex-start}
.msg-avatar{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-size:17px;font-weight:700}
.msg-avatar.ai{background:linear-gradient(135deg,#7a92ff,#5a6cf0);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.msg-avatar.user{background:linear-gradient(135deg,#ffc58a,#ff8a3d);color:#fff}
.msg-body{flex:1;min-width:0}
.msg-meta{display:flex;align-items:center;gap:10px;margin-bottom:9px;color:var(--text-3);font-size:12px}
.msg-meta .name{font-weight:600;color:var(--text)}
.think-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:#a9b6ff;font-size:11px;font-weight:600}
.msg-meta .actions{margin-left:auto;display:flex;gap:4px;align-items:center}
.msg-meta .actions button{color:var(--text-3);font-size:12px;padding:4px 8px;border-radius:7px;display:flex;align-items:center;gap:4px;transition:background .15s,color .15s}
.msg-meta .actions button:hover{background:var(--surface-2);color:var(--text)}
.msg-text{line-height:1.75;color:#dfe3ee;white-space:pre-wrap}
.codeblock{margin-top:12px;background:#0e0f14;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:12.5px;line-height:1.65}
.codeblock .cb-head{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:rgba(255,255,255,.02);color:var(--text-3);font-size:12px}
.codeblock .cb-head .np{color:var(--text-3);font-weight:500}
.codeblock .cb-head button{color:var(--text-3);font-size:12px;display:flex;align-items:center;gap:5px}
.codeblock .cb-head button:hover{color:var(--text)}
.codeblock pre{margin:0;padding:14px 16px;overflow:auto;white-space:pre-wrap;color:#c9d1e3}
.msg-foot{max-width:790px;margin:0 auto 24px;padding:0 30px;display:flex;align-items:center;gap:10px}
.msg-foot .actions{margin-left:auto;display:flex;gap:4px}
.msg-foot .actions button{color:var(--text-3);font-size:12px;padding:6px 10px;border-radius:8px;display:flex;align-items:center;gap:5px;transition:background .15s,color .15s}
.msg-foot .actions button:hover{background:var(--surface-2);color:var(--text)}
.tokens{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.tokens b{color:#a9b6ff;font-weight:600}
.tokens .ok{color:var(--green);font-size:11px}

/* dock */
.dock{padding:12px 30px 26px;background:linear-gradient(180deg,transparent,rgba(9,9,13,.92) 40%)}
.dock-box{max-width:860px;margin:0 auto;background:#111219;border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;transition:border-color .2s}
.dock-box:focus-within{border-color:rgba(109,124,255,.4)}
.dock-strip{display:flex;align-items:center;gap:6px;padding:10px 12px 0}
.attach{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--text-3);transition:background .15s,color .15s}
.attach:hover{background:var(--surface-2);color:var(--text)}
.threshold{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-3)}
.threshold input[type=range]{width:76px;accent-color:var(--accent)}
.dock textarea{width:100%;min-height:80px;resize:none;padding:8px 14px 4px;font-size:14px;line-height:1.6;color:var(--text)}
.dock textarea::placeholder{color:var(--text-3)}
.dock-foot{display:flex;align-items:center;gap:6px;padding:8px 12px 12px;flex-wrap:wrap}
.chip-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;background:var(--surface-2);color:var(--text-2);font-size:12.5px;border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
.chip-btn:hover{background:var(--surface-3);color:var(--text)}
.chip-btn.on{border-color:rgba(109,124,255,.5);color:#a9b6ff;background:var(--accent-soft)}
.chip-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.chip-btn svg{width:14px;height:14px;opacity:.8}
.dock-send{margin-left:auto}
.send-btn{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#7a92ff,#5a6cf0);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(90,108,240,.4),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .12s var(--ease),filter .15s}
.send-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* ---------- Creation pages ---------- */
.nebula{position:relative}
.nebula::before{content:"";position:absolute;inset:0;background:radial-gradient(700px 420px at 50% -8%,rgba(109,124,255,.10),transparent 60%),radial-gradient(600px 380px at 80% 100%,rgba(255,154,77,.04),transparent 60%);pointer-events:none}
.creation-head{text-align:center;padding:16px 0 4px;position:relative}
.creation-head .eyebrow{color:var(--text-3);font-size:12.5px;letter-spacing:2px;margin-bottom:14px}
.creation-head h1{font-size:34px;font-weight:750;margin:0 0 10px;display:inline-flex;align-items:center;gap:14px;letter-spacing:-.01em}
.creation-head h1 .ic-tile{width:46px;height:46px;border-radius:13px;font-size:15px;box-shadow:var(--shadow-sm)}
.creation-head .tagline{color:var(--text-2);font-size:14px;margin-bottom:8px}
.creation-head .sub{color:var(--text-3);font-size:12.5px}
.creation-head .sub b{color:#ffb277;font-weight:600}
.badge-pub{font-size:10px;padding:3px 9px;border-radius:999px;background:var(--accent-2-soft);color:#ffb277;font-weight:700;vertical-align:middle;letter-spacing:.3px}

.avatar-row{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;padding:16px 0 24px;position:relative}
.role{width:128px;display:flex;flex-direction:column;align-items:center;gap:9px}
.role .r-av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.role .r-av img,.agent-avatar-img{width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:inherit;display:block}
.role .r-av img{filter:saturate(.92) contrast(1.04)}
.item .ic-tile{overflow:hidden}
.role .r-av .mini{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-size:9px;padding:2px 9px;border-radius:999px;background:var(--surface-3);color:#ffb277;font-weight:700;border:1px solid var(--line-strong);letter-spacing:.3px}
.role .r-name{font-size:12.5px;color:var(--text-2);text-align:center}

.creation-card{max-width:840px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:22px 26px;position:relative}
.creation-card .start-line{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-bottom:4px}
.creation-card .start-line .ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:#a9b6ff;display:grid;place-items:center}
.creation-card .hint{color:var(--text-3);font-size:12px;margin-bottom:8px}
.opt-group{padding:14px 0;border-top:1px solid var(--line)}
.opt-group:first-of-type{border-top:none}
.opt-group label{font-size:13px;color:var(--text);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:11px}
.opt-group label .muted{color:var(--text-3);font-weight:400;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:9px;background:var(--surface-2);border:1px solid transparent;color:var(--text-2);font-size:12.5px;transition:background .13s,color .13s,border-color .13s}
.chip:hover{background:var(--surface-3);color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:rgba(109,124,255,.45);color:#b9c5ff;font-weight:600}
.creation-note{max-width:840px;margin:16px auto 0;color:var(--text-3);font-size:11.5px;text-align:center}
.creation-note b{color:#ffb277}
.dock-creation{max-width:860px;margin:22px auto 0;position:relative}
.switch-btn{max-width:860px;margin:14px auto 0;display:block;padding:10px 18px;border-radius:11px;background:var(--surface-2);color:var(--text-2);font-size:13px;transition:background .15s,color .15s}
.switch-btn:hover{background:var(--surface-3);color:var(--text)}
.agent-preview{max-width:860px;margin:22px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.agent-preview-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
.agent-preview-head b{font-size:14px}.agent-status{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:11px}.agent-status i{width:6px;height:6px;border-radius:50%;background:currentColor}
.preview-messages{min-height:108px;max-height:220px;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.preview-msg{max-width:78%;padding:9px 12px;border-radius:11px;font-size:13px;line-height:1.6}.preview-msg.ai{align-self:flex-start;background:var(--surface-2);color:var(--text-2)}.preview-msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.preview-compose{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.preview-compose input{flex:1;padding:9px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface-2);font-size:13px}.preview-compose button{padding:9px 14px;border-radius:9px;background:var(--accent);color:#fff;font-size:12px;font-weight:600}
.chat-dock .dock-box{max-width:920px;border-radius:18px;background:rgba(255,255,255,.94);border:1px solid rgba(74,101,161,.2);border-top:0;border-bottom:0;box-shadow:0 14px 36px rgba(54,79,131,.14)}.chat-config{display:flex;align-items:center;gap:8px;padding:10px 14px 0;color:var(--text-3);font-size:11px}.chat-config input,.chat-config select{height:28px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);color:var(--text);font-size:11px;padding:0 9px}.chat-config input{flex:1;min-width:120px}.chat-config select{width:132px}.chat-config button{height:28px;padding:0 9px;border-radius:8px;background:var(--surface-3);color:var(--text-2);font-size:11px}.chat-config button:hover{background:var(--accent-soft);color:var(--accent)}.chat-dock textarea{min-height:108px;padding:16px 16px 8px;font-size:15px;line-height:1.65;color:var(--text);background:transparent;border-top:0!important;border-bottom:0!important;box-shadow:none}.chat-dock textarea::placeholder{color:#a3aec2}.chat-dock .dock-strip{padding-top:8px;border:0}.chat-dock .dock-foot{padding:8px 14px 14px;border:0}.chat-dock .chip-btn{background:#f3f6fb}.chat-dock .chip-btn:hover{background:#e8efff}.chat-dock .send-btn{width:46px;height:46px;border-radius:14px}.chat-dock .send-btn:disabled{opacity:.35}.chat-dock .threshold{margin-left:auto}.chat-dock .threshold input[type=range]{accent-color:var(--accent)}
.preview-config{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(246,248,252,.7)}.preview-config input,.preview-config select{height:30px;padding:0 9px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--text);font-size:11px}.preview-config input{flex:1;min-width:0}.preview-config select{width:138px}.preview-config button{height:30px;padding:0 10px;border-radius:8px;background:var(--surface-3);color:var(--text-2);font-size:11px}.preview-config button:hover{background:var(--accent-soft);color:var(--accent)}
.preview-error{padding:8px 14px;color:#c45858;background:#fff3f1;border-top:1px solid #f2d1cb;font-size:11px;line-height:1.5}.nebula .preview-config{background:rgba(12,17,27,.8);border-color:rgba(255,255,255,.08)}.nebula .preview-config input,.nebula .preview-config select{background:#121a28;border-color:rgba(255,255,255,.12);color:#e9edf8}.nebula .preview-config button{background:#202a3b;color:#aeb9cc}.nebula .preview-error{background:#2a1718;border-color:#5f2e2d;color:#ffaaa3}

.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tool-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:transform .15s var(--ease),border-color .15s,box-shadow .15s;box-shadow:var(--shadow-sm)}
.tool-card:hover{transform:translateY(-3px);border-color:rgba(109,124,255,.4);box-shadow:var(--shadow)}
.tool-card .tc-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tool-card .tc-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:16px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.tool-card b{font-size:15px;font-weight:650}
.tool-card .tc-desc{color:var(--text-2);font-size:12.5px;line-height:1.6;min-height:40px}
.tool-card .tc-foot{margin-top:12px;display:flex;align-items:center;justify-content:space-between;color:var(--text-3);font-size:11.5px}
.tool-card .tc-foot .go{color:#a9b6ff;font-weight:600}

/* gallery */
.gallery{display:flex;gap:16px;height:100%;padding:18px 20px}

.gal-side h4{margin:16px 0 10px;font-size:12px;color:var(--text-3);font-weight:600;letter-spacing:.4px}
.gal-side h4:first-child{margin-top:2px}
.gal-tabs{display:flex;flex-wrap:wrap;gap:6px}
.gal-tab{padding:6px 11px;border-radius:9px;background:var(--surface-2);font-size:12px;color:var(--text-2);cursor:pointer;transition:background .13s,color .13s}
.gal-tab:hover{color:var(--text)}
.gal-tab.active{background:var(--accent-soft);color:#a9b6ff;font-weight:600}
.gal-main{flex:1;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.gal-cats{position:sticky;top:0;background:var(--surface);display:flex;flex-wrap:wrap;gap:6px;padding-bottom:14px;z-index:2}
.gal-cats .cat{padding:6px 13px;border-radius:9px;font-size:11.5px;color:var(--text-2);cursor:pointer;background:var(--surface-2);transition:background .13s,color .13s}
.gal-cats .cat:hover{color:var(--text)}
.gal-cats .cat.active{background:var(--accent);color:#fff;font-weight:600}
.gal-masonry{columns:4 210px;column-gap:14px}
.tile{break-inside:avoid;margin-bottom:14px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--line)}
.tile .ph{position:relative;display:block;width:100%;overflow:hidden}
.tile .ph img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.03);transition:transform .35s var(--ease),filter .35s var(--ease)}
.tile:hover .ph img{transform:scale(1.045);filter:saturate(1.05) contrast(1.04)}

.tile .acts button:hover{background:rgba(0,0,0,.7)}

.hidden{display:none!important}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#171922;border:1px solid var(--line-strong);color:#fff;padding:10px 18px;border-radius:11px;font-size:13px;box-shadow:var(--shadow-lg);z-index:999;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* ---------- unified light workspace theme ---------- */
:root{
  --bg:#f3f6fb;
  --surface:#ffffff;
  --surface-2:#f6f8fc;
  --surface-3:#eaf0fb;
  --line:rgba(37,60,110,.11);
  --line-strong:rgba(37,60,110,.18);
  --text:#15233a;
  --text-2:#5b6b84;
  --text-3:#8d99b3;
  --accent:#466dff;
  --accent-2:#f28a3d;
  --green:#16a967;
  --accent-soft:#e8efff;
  --accent-2-soft:#fff0e6;
  --green-soft:#e2f6ee;
  --shadow-sm:0 1px 2px rgba(37,60,110,.06);
  --shadow:0 8px 24px rgba(37,60,110,.10);
  --shadow-lg:0 18px 48px rgba(37,60,110,.15);
}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(1000px 580px at 50% -18%,rgba(91,111,255,.10),transparent 64%),
    radial-gradient(760px 520px at 96% 108%,rgba(44,190,205,.07),transparent 58%);
}
.topbar,.leftnav{background:rgba(255,255,255,.86)}
.leftpanel,.creation-card,.tool-card,.gal-side,.gal-main{background:var(--surface)}
.search:focus-within{background:var(--surface-2)}
.msg-text{color:var(--text);}
.codeblock{background:#f7f9fd;border-color:var(--line-strong)}
.codeblock .cb-head{background:#eef3fb;color:var(--text-2)}
.codeblock pre{color:#33435d}
.dock{background:linear-gradient(180deg,transparent,rgba(243,246,251,.96) 40%)}
.dock-box{background:var(--surface)}
.dock textarea{color:var(--text)}
:where(button,input,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:1100px){
  .app{grid-template-columns:auto 220px 1fr}
  .topbar{grid-column:1/4}
}
@media (max-width:760px){
  .app{grid-template-columns:0 1fr 1fr}
  .leftnav{display:none}
  .leftpanel{grid-column:1/3;display:none}
  .main{grid-column:1/4}
  .view-inner{padding:20px 16px 24px}
  .msg{padding:0 16px}
  .dock{padding:10px 12px 16px}
  .dock-foot{gap:5px}
  .chip-btn{padding:7px 9px}
  .gallery{padding:12px;display:block}
  .gal-side{width:auto;margin-bottom:12px}
  .gal-masonry{columns:2 150px}
}
@media (max-width:480px){
  .brand{min-width:0}
  .brand .sub,.new-chat{display:none}
  .creation-head h1{font-size:26px}
  .creation-card{padding:18px 16px}
  .gal-masonry{columns:1}
}

  const inp=w.querySelector('#chatInput'),sendBtn=w.querySelector('#sendBtn'),keyInput=w.querySelector('#chatKey'),modelInput=w.querySelector('#chatModel'),saveKey=w.querySelector('#chatSaveKey');let controller=null;const history=[];const savedKey=localStorage.getItem('deepseek_api_key');if(savedKey)keyInput.value=savedKey;
  inp.addEventListener('input',()=>sendBtn.disabled=!inp.value.trim()&&!controller);inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}});sendBtn.addEventListener('click',()=>controller?controller.abort():doSend());saveKey.addEventListener('click',()=>{const k=keyInput.value.trim();if(!k){toast('请先粘贴 DeepSeek API Key');return;}localStorage.setItem('deepseek_api_key',k);toast('Key 已保存在当前浏览器');});w.querySelector('input[type=range]').addEventListener('input',e=>w.querySelector('#tn').textContent=e.target.value);w.querySelectorAll('.chip-btn').forEach(c=>c.addEventListener('click',()=>{c.classList.toggle('on');toast(c.textContent.trim()+'（示意）');}));

ory.push({role:'assistant',content:body.textContent});re.querySelector('.think-badge').textContent='已完成';}catch(err){if(err.name==='AbortError'){re.querySelector('.think-badge').textContent='已停止';}else{body.textContent=`调用失败：${err.message||'网络错误'}`;re.querySelector('.think-badge').textContent='调用失败';}}finally{controller=null;sendBtn.innerHTML=ICONS.send;sendBtn.disabled=!inp.value.trim();}}
  m.appendChild(w);
}

function bindCreation(w,tool){
  w.querySelectorAll('.opt-group .chips').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;g.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');}));

  const pi=w.querySelector('#previewInput'),ps=w.querySelector('#previewSend'),pm=w.querySelector('#previewMessages'),keyInput=w.querySelector('#previewKey'),modelInput=w.querySelector('#previewModel'),status=w.querySelector('#previewStatus'),save=w.querySelector('#previewSave'),clear=w.querySelector('#previewClear');

`;pm.appendChild(box);setStatus('连接失败',false);}}finally{controller=null;ps.textContent='发送';}}
  const send=w.querySelector('.dock-send .send-btn');if(send)send.addEventListener('click',()=>{const ta=w.querySelector('.dock textarea');if(ta&&ta.value.trim()){pi.value=ta.value.trim();ta.value='';preview();w.querySelector('.agent-preview').scrollIntoView({behavior:'smooth',block:'center'});}});
  ps.onclick=()=>{if(controller){controller.abort();controller=null;}else preview();};pi.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();preview();}});

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function init(){
  const h=location.hash.replace('#','');

  if(['models','agents','inspire','ai'].includes(nav))state.nav=nav;
  if(nav==='models'&&['mine','chat','image','video','music'].includes(sub))state.modelTab=sub;
